name: Supabase Migration Validation

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target (production is intentionally unavailable)"
        required: true
        type: choice
        options:
          - non-production
        default: non-production
      operation:
        description: "Allowed operation"
        required: true
        type: choice
        options:
          - dry-run
        default: dry-run
      approval_phrase:
        description: "Type APPROVE_NON_PRODUCTION_DRY_RUN to continue"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-non-production-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Supabase migrations (non-production dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: supabase-non-production
    env:
      SUPABASE_NONPROD_ACCESS_TOKEN: ${{ secrets.SUPABASE_NONPROD_ACCESS_TOKEN }}
      SUPABASE_NONPROD_PROJECT_ID: ${{ secrets.SUPABASE_NONPROD_PROJECT_ID }}
      SUPABASE_NONPROD_DB_PASSWORD: ${{ secrets.SUPABASE_NONPROD_DB_PASSWORD }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      OPERATION: ${{ inputs.operation }}
      APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify non-production target and approval
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_ENVIRONMENT" = "non-production" || { echo "STOP: production target is not permitted by this workflow" >&2; exit 1; }
          test "$OPERATION" = "dry-run" || { echo "STOP: only dry-run is permitted by this workflow" >&2; exit 1; }
          test "$APPROVAL_PHRASE" = "APPROVE_NON_PRODUCTION_DRY_RUN" || { echo "STOP: explicit dry-run approval phrase is invalid" >&2; exit 1; }
          test -n "$SUPABASE_NONPROD_ACCESS_TOKEN" || { echo "STOP: missing SUPABASE_NONPROD_ACCESS_TOKEN" >&2; exit 1; }
          test -n "$SUPABASE_NONPROD_PROJECT_ID" || { echo "STOP: missing SUPABASE_NONPROD_PROJECT_ID" >&2; exit 1; }
          test -n "$SUPABASE_NONPROD_DB_PASSWORD" || { echo "STOP: missing SUPABASE_NONPROD_DB_PASSWORD" >&2; exit 1; }
          test -d supabase/migrations || { echo "STOP: supabase/migrations directory is missing" >&2; exit 1; }
          echo "Target verified: non-production"
          echo "Operation verified: dry-run only"

      - name: Validate migration plan without applying changes
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_DB_URL="$(SUPABASE_NONPROD_DB_PASSWORD="$SUPABASE_NONPROD_DB_PASSWORD" python3 -c 'import os; from urllib.parse import quote; password = os.environ["SUPABASE_NONPROD_DB_PASSWORD"]; print("postgresql://postgres:" + quote(password, safe="") + "@db.snlpgxugdbcbhpwxqjgp.supabase.co:5432/postgres")')"
          test -n "$SUPABASE_DB_URL" || { echo "STOP: failed to build SUPABASE_DB_URL" >&2; exit 1; }
          supabase db diff --db-url "$SUPABASE_DB_URL" --schema public

      - name: Stop condition confirmation
        if: always()
        shell: bash
        run: |
          echo "No production target is available in this workflow."
          echo "No migration apply step is defined."
          echo "Any validation failure stops the job."
