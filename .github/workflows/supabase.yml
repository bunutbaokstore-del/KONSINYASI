name: Supabase Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub Secret: SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing GitHub Secret: SUPABASE_PROJECT_ID" >&2; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing GitHub Secret: SUPABASE_DB_PASSWORD" >&2; exit 1; }
          test -d supabase/migrations || { echo "supabase/migrations directory is missing" >&2; exit 1; }

      - name: Link Supabase project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        shell: bash
        run: supabase db push --linked
